{% extends "base.html" %}
{% block content %}
<h1>Смена пароля</h1>

{% if forced %}
<div class="box notice">
  Учётная запись создана администратором. Перед работой нужно задать свой пароль.
</div>
{% endif %}

<form method="post" action="/password/change">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label>Текущий пароль</label>
  <input type="password" name="current_password" required>

  <label>Новый пароль
    <span class="hint">не короче 12 символов, строчные и заглавные буквы,
      цифра и специальный символ</span>
  </label>
  <input type="password" name="password" required>

  <label>Новый пароль ещё раз</label>
  <input type="password" name="password_repeat" required>

  <button type="submit">Сменить пароль</button>
  <p class="slow">После смены все открытые сессии закрываются, включая текущую.</p>
</form>
{% endblock %}
