{% extends "base.html" %}
{% block content %}
<h1>Восстановление пароля</h1>
<p class="hint">На указанный адрес придёт одноразовая ссылка.
   Ответ страницы одинаков независимо от того, зарегистрирован адрес или нет —
   иначе форму можно было бы использовать для проверки чужих адресов.</p>

<form method="post" action="/password/reset">
  <label>Электронная почта</label>
  <input type="email" name="email" required autofocus>
  <button type="submit">Отправить ссылку</button>
</form>
{% endblock %}
